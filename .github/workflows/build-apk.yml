name: Build Naol SMS APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Dependencies & Generate Android Project
        run: |
          npm install
          npx cap init "Naol SMS" "com.naol.smsforwarder" --web-dir .
          npx cap add android

      - name: Sync Android
        run: |
          npx cap sync android

      - name: Inject Native SMS Permissions & Java Bridge
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          
          sed -i 's|<uses-permission android:name="android.permission.INTERNET" />|<uses-permission android:name="android.permission.INTERNET" />\n    <uses-permission android:name="android.permission.RECEIVE_SMS" />\n    <uses-permission android:name="android.permission.READ_SMS" />|' $MANIFEST

          RECEIVER_XML='<receiver android:name=".SmsReceiver" android:exported="true" android:permission="android.permission.BROADCAST_SMS"><intent-filter android:priority="999"><action android:name="android.provider.Telephony.SMS_RECEIVED" /></intent-filter></receiver>'
          sed -i "s|</application>|${RECEIVER_XML}\n</application>|" $MANIFEST

          JAVA_DIR="android/app/src/main/java/com/naol/smsforwarder"
          mkdir -p $JAVA_DIR

          cat << 'EOF' > $JAVA_DIR/SmsReceiver.java
          package com.naol.smsforwarder;

          import android.content.BroadcastReceiver;
          import android.content.Context;
          import android.content.Intent;
          import android.os.Bundle;
          import android.telephony.SmsMessage;

          public class SmsReceiver extends BroadcastReceiver {
              @Override
              public void onReceive(Context context, Intent intent) {
                  if ("android.provider.Telephony.SMS_RECEIVED".equals(intent.getAction())) {
                      Bundle bundle = intent.getExtras();
                      if (bundle != null) {
                          Object[] pdus = (Object[]) bundle.get("pdus");
                          if (pdus != null) {
                              StringBuilder fullMessage = new StringBuilder();
                              String sender = "";
                              for (Object pdu : pdus) {
                                  SmsMessage sms = SmsMessage.createFromPdu((byte[]) pdu);
                                  sender = sms.getOriginatingAddress();
                                  fullMessage.append(sms.getMessageBody());
                              }
                              MainActivity.forwardSmsToJs(sender, fullMessage.toString());
                          }
                      }
                  }
              }
          }
          EOF

          cat << 'EOF' > $JAVA_DIR/MainActivity.java
          package com.naol.smsforwarder;

          import android.Manifest;
          import android.content.pm.PackageManager;
          import android.os.Bundle;
          import androidx.core.app.ActivityCompat;
          import androidx.core.content.ContextCompat;
          import com.getcapacitor.BridgeActivity;
          import org.json.JSONObject;

          public class MainActivity extends BridgeActivity {
              private static MainActivity instance;

              @Override
              public void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  instance = this;
                  if (ContextCompat.checkSelfPermission(this, Manifest.permission.RECEIVE_SMS) != PackageManager.PERMISSION_GRANTED) {
                      ActivityCompat.requestPermissions(this, new String[]{Manifest.permission.RECEIVE_SMS, Manifest.permission.READ_SMS}, 101);
                  }
              }

              public static void forwardSmsToJs(String sender, String body) {
                  if (instance != null && instance.getBridge() != null) {
                      String safeSender = JSONObject.quote(sender);
                      String safeBody = JSONObject.quote(body);
                      String js = "if(window.onSmsReceived){ window.onSmsReceived(" + safeSender + ", " + safeBody + "); }";
                      instance.runOnUiThread(() -> instance.getBridge().getWebView().evaluateJavascript(js, null));
                  }
              }
          }
          EOF

      - name: Build Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload Naol SMS APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Naol-SMS-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
